server.port=8082

# Addresses of the services this one calls; under Docker, environment variables change them to service names
services.backend-url=${BACKEND_URL:http://127.0.0.1:8080}

# Shared secret for internal endpoints, sent in the X-Internal-Token header between services. When empty, only localhost may call (local dev)
internal.token=${INTERNAL_TOKEN:}

# go-judge sandbox address; never expose it to the internet
sandbox.url=${SANDBOX_URL:http://127.0.0.1:5050}
