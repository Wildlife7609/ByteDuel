spring.application.name=backend

# 自动激活本地私有配置（若存在）
spring.profiles.include=local

spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=jdbc:mysql://localhost:3306/kob?serverTimezone=America/Los_Angeles&useUnicode=true&characterEncoding=utf-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT 配置（敏感密钥由 application-local.properties 或环境变量覆盖）
jwt.secret=${JWT_SECRET:}
# 有效期：14天（以毫秒为单位：14 * 24 * 60 * 60 * 1000 = 1209600000）
jwt.ttl=${JWT_TTL:1209600000}