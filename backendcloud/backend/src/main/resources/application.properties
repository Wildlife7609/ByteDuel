spring.application.name=backend

# 自动激活本地私有配置（若存在）
spring.profiles.include=local

spring.datasource.username=${DB_USERNAME:kob}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kob}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT 配置（敏感密钥由 application-local.properties 或环境变量覆盖）
jwt.secret=${JWT_SECRET:}
# 有效期：14天（以毫秒为单位：14 * 24 * 60 * 60 * 1000 = 1209600000）
jwt.ttl=${JWT_TTL:1209600000}

# 要调用的服务地址，部署到 Docker 时用环境变量改成服务名
services.matching-url=${MATCHING_URL:http://127.0.0.1:8081}
services.bot-running-url=${BOT_RUNNING_URL:http://127.0.0.1:8082}

# 内部接口的共享密钥，服务之间互相调用时放在 X-Internal-Token 请求头里。为空时只允许本机调用（本地开发）
internal.token=${INTERNAL_TOKEN:}