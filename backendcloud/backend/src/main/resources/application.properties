spring.application.name=backend

# Activate the private local profile if it exists
spring.profiles.include=local

spring.datasource.username=${DB_USERNAME:kob}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kob}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT settings (the secret is overridden by application-local.properties or an environment variable)
jwt.secret=${JWT_SECRET:}
# Lifetime: 14 days in milliseconds (14 * 24 * 60 * 60 * 1000 = 1209600000)
jwt.ttl=${JWT_TTL:1209600000}

# Addresses of the services backend calls; under Docker, environment variables change them to service names
services.matching-url=${MATCHING_URL:http://127.0.0.1:8081}
services.bot-running-url=${BOT_RUNNING_URL:http://127.0.0.1:8082}

# Shared secret for internal endpoints, sent in the X-Internal-Token header between services. When empty, only localhost may call (local dev)
internal.token=${INTERNAL_TOKEN:}