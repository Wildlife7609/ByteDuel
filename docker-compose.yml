# 整套服务的部署配置，步骤见 deploy/README.md
# 所有可配置项都在同目录的 .env 里（模板：.env.example），只有 web 对外开放端口，其余都在内部网络
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kob
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      POSTGRES_DB: kob
    volumes:
      # PostgreSQL 18 的镜像把数据目录挂在 /var/lib/postgresql（旧版本是 /var/lib/postgresql/data）
      - pgdata:/var/lib/postgresql
      # 数据卷为空时（第一次启动）自动执行建表脚本
      - ./backendcloud/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kob -d kob"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox:
    build: ./backendcloud/sandbox
    restart: unless-stopped
    # go-judge 要在容器里再创建隔离环境和子 cgroup，必须有这两项
    privileged: true
    cgroup: host
    shm_size: 256m

  botrunningsystem:
    build:
      context: ./backendcloud
      target: botrunningsystem
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      SANDBOX_URL: http://sandbox:5050
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 .env 里设置 INTERNAL_TOKEN}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      - sandbox

  matchingsystem:
    build:
      context: ./backendcloud
      target: matchingsystem
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 .env 里设置 INTERNAL_TOKEN}
      JAVA_TOOL_OPTIONS: -Xmx128m

  backend:
    build:
      context: ./backendcloud
      target: backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kob
      DB_USERNAME: kob
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET}
      MATCHING_URL: http://matchingsystem:8081
      BOT_RUNNING_URL: http://botrunningsystem:8082
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 .env 里设置 INTERNAL_TOKEN}
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      postgres:
        condition: service_healthy
      matchingsystem:
        condition: service_started
      botrunningsystem:
        condition: service_started

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TLS: ${TLS:-}
    volumes:
      - ${CERTS_DIR:-./certs}:/certs:ro
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
