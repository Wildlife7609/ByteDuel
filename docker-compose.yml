# Deployment config for the whole stack; see deploy/README.md for the steps
# All settings live in .env next to this file (template: .env.example). Only web publishes ports; everything else stays on the internal network
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kob
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: kob
    volumes:
      # The PostgreSQL 18 image keeps its data under /var/lib/postgresql (older versions used /var/lib/postgresql/data)
      - pgdata:/var/lib/postgresql
      # Runs the schema script when the volume is empty (first start)
      - ./backendcloud/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kob -d kob"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox:
    build: ./backendcloud/sandbox
    restart: unless-stopped
    # go-judge creates isolated environments and child cgroups inside the container, so both are required
    privileged: true
    cgroup: host
    shm_size: 256m

  botrunningsystem:
    build:
      context: ./backendcloud
      target: botrunningsystem
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      SANDBOX_URL: http://sandbox:5050
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      - sandbox

  matchingsystem:
    build:
      context: ./backendcloud
      target: matchingsystem
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}
      JAVA_TOOL_OPTIONS: -Xmx128m

  backend:
    build:
      context: ./backendcloud
      target: backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kob
      DB_USERNAME: kob
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      MATCHING_URL: http://matchingsystem:8081
      BOT_RUNNING_URL: http://botrunningsystem:8082
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      postgres:
        condition: service_healthy
      matchingsystem:
        condition: service_started
      botrunningsystem:
        condition: service_started

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TLS: ${TLS:-}
    volumes:
      - ${CERTS_DIR:-./certs}:/certs:ro
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
